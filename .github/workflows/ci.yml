name: Hrd Parp Triager Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[api,test]'

    - name: Check Python syntax and installed entry point
      run: |
        python -m compileall -q agents hrd_parp_triager_agent cli.py hrd_parp_sentinel.py
        hrd-parp-triager-engine audit --case-id CI-SYNTH-001 --primary 10 --secondary 2 --status NOMINAL

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Run browser demonstration smoke test
      run: node tests/web_smoke.cjs

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
