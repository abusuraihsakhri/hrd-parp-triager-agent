[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hrd-parp-triager-engine"
version = "2.0.0"
description = "HRD-Sentinel: Homologous Recombination Deficiency & PARP Inhibitor Response Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=7,<10", "httpx>=0.24,<1"]

[project.scripts]
hrd-parp-triager-engine = "hrd_parp_triager_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/hrd-parp-triager-agent"
Repository = "https://github.com/abusuraihsakhri/hrd-parp-triager-agent"

[tool.setuptools.packages.find]
include = ["agents*", "hrd_parp_triager_agent*"]
